# Supabase free projects pause after 7 idle days. Ping the API every 3 days.
# Repo secrets: SUPABASE_URL, SUPABASE_ANON_KEY
name: keep supabase awake
on:
  schedule: [{ cron: '0 3 */3 * *' }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/groups?select=id&limit=1" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
